<!doctype html>
<html lang="en" data-theme="night" data-dim="2d">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved choices before styles load (keep in step with
      // lib/theme.ts and lib/dimension.ts): dark unless chosen otherwise,
      // 'auto' follows the device; flat unless 3D was chosen.
      (() => {
        let preference = 'night'
        try { preference = localStorage.getItem('williamslab.theme') || 'night' } catch {}
        document.documentElement.dataset.theme = preference === 'day' || preference === 'night'
          ? preference
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'
        let dim = null
        try { dim = localStorage.getItem('williamslab.dim') } catch {}
        document.documentElement.dataset.dim = dim === '3d' ? '3d' : '2d'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Evidence synthesis, systematic review, meta-analysis, research QA, and manuscript environment." />
